[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autumn-jobs"
version = "0.1.0"
description = "A practical personal index of public autumn recruitment jobs"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.13,<3",
  "PyYAML>=6.0,<7",
  "selectolax>=0.4,<0.5",
  "tenacity>=9.1,<10",
  "rapidfuzz>=3.14,<4",
  "python-dateutil>=2.9,<3",
  "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
dynamic = ["playwright>=1.61,<2"]
dev = ["pytest>=9.1,<10", "pytest-cov>=7.1,<8", "respx>=0.23,<0.24", "ruff>=0.16,<0.17"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

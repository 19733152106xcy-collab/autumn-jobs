<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2027届秋招岗位库</title>
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body>
    <main>
      <h1>2027届秋招岗位库</h1>
      <p id="updated" class="muted">最近更新：加载中</p>
      <section class="controls" aria-label="岗位筛选">
        <button id="today" type="button">今日新增</button>
        <button id="all" type="button">全部岗位</button>
        <input id="search" type="search" placeholder="搜索公司或岗位">
        <select id="category" aria-label="岗位方向"></select>
        <select id="city" aria-label="城市"></select>
        <select id="level" aria-label="匹配等级"><option>全部</option><option>A</option><option>B</option><option>C</option></select>
        <select id="verification-filter" aria-label="核验状态"><option value="">全部状态</option><option value="verified">已核验</option><option value="pending">待核验</option></select>
        <select id="order" aria-label="排序"><option>更新时间</option></select>
      </section>
      <p id="count" class="muted"></p>
      <p id="error" hidden>岗位数据暂时不可用，请稍后刷新。</p>
      <p id="empty" hidden>当前筛选下暂无岗位。</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>公司</th><th>岗位</th><th>工作地点</th><th>截止日期</th><th>投递</th></tr></thead>
          <tbody id="jobs-body"></tbody>
        </table>
      </div>
    </main>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
